# render.yaml — Render Blueprint Specification for CINEVERSE
# Located at repository root for automatic detection by Render.

services:
  - type: web
    name: cineverse-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    region: singapore
    plan: free

    envVars:
      - key: PORT
        value: "10000"
      - key: ALLOWED_ORIGINS
        value: "https://cineverse.vercel.app,http://localhost:5173,http://localhost:3000"
      - key: TMDB_API_KEY
        sync: false        # Optional: Set in Render dashboard if you wish to add a custom TMDB key

    healthCheckPath: /
