# render.yaml — Render deployment configuration for CINEVERSE
#
# SETUP STEPS:
# 1. Push your repo to GitHub (with Git LFS: git lfs push origin --all)
# 2. Connect your GitHub repo to Render
# 3. Render will auto-detect this file
# 4. In the Render dashboard, set TMDB_API_KEY in environment variables
# 5. Update ALLOWED_ORIGINS with your frontend URL (Vercel/Netlify)

services:
  - type: web
    name: cineverse-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend

    # CRITICAL: Enable Git LFS so Render downloads the 176 MB similarity.pkl
    # Without this, Render clones only the LFS pointer file (~135 bytes)
    # and the backend will crash with a "metadata-generation-failed" error.
    lfsEnabled: true

    # Plan: starter is free but has 512 MB RAM limit.
    # The similarity.pkl needs ~500 MB RAM — use the "standard" plan ($7/mo)
    # if you see out-of-memory errors on Render.
    plan: starter
    region: oregon

    envVars:
      - key: TMDB_API_KEY
        sync: false        # Set this manually in Render dashboard (never commit the key)
      - key: ALLOWED_ORIGINS
        # Replace with your actual Vercel/Netlify URL after deploying the frontend
        value: "https://your-cineverse-app.vercel.app,http://localhost:5173,http://localhost:3000"

    healthCheckPath: /

